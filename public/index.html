<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>KPSS Çalış · Özgür</title>
  <meta name="description" content="Özgür'ün 9 günlük KPSS Ön Lisans çalışma planı: günlük dersler, görselli anlatımlar, sorular ve yapay zekâ hoca.">
  <meta name="theme-color" content="#F6F5F7">
  <script>
    // Temayı ilk boyamadan önce uygula (beyaz/siyah parlama olmasın)
    (function () {
      var t = 'light';
      try { var s = JSON.parse(localStorage.getItem('kpss-ozgur-v1') || '{}'); if (s.settings && s.settings.theme === 'dark') t = 'dark'; } catch (e) {}
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#111114' : '#F6F5F7';
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KPSS Özgür">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <nav class="tabbar" id="tabbar" aria-label="Ana menü" hidden></nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Bu uygulama JavaScript ile çalışır.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
