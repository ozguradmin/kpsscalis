name: Cloudflare'e yayınla

on:
  push:
    branches: [main, claude/cloudflare-account-connection-hq2usr]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: İçerik denetimi
        run: node scripts/check-content.mjs
      - name: Worker'ı yayınla
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret'ı tanımlı değil, yayın atlandı."
            exit 0
          fi
          npx wrangler deploy
