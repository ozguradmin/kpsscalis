name: Canlı log (wrangler tail)

# Çalıştırmak için: git push origin HEAD:is-ajani-log --force
on:
  push:
    branches: [is-ajani-log]

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dinle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: timeout 12m npx wrangler tail ozgur-is-ajani --format json > tail.jsonl 2> tail.err || true
      - name: Özet
        run: |
          echo "--- stderr ---"; tail -n 20 tail.err || true
          echo "--- olay sayısı: $(wc -l < tail.jsonl)"
          node test/tail-summary.cjs tail.jsonl
