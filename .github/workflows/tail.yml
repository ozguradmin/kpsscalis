name: Canlı log (wrangler tail)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Kaç dakika dinlensin
        default: "10"

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dinle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: timeout ${{ github.event.inputs.minutes }}m npx wrangler tail ozgur-is-ajani --format json > tail.jsonl 2> tail.err || true
      - name: Özet
        run: |
          echo "--- stderr ---"; tail -n 20 tail.err || true
          echo "--- olay sayısı: $(wc -l < tail.jsonl)"
          node -e '
            const fs=require("fs"); const lines=fs.readFileSync("tail.jsonl","utf8").split("\n").filter(Boolean);
            for (const l of lines) { let e; try { e=JSON.parse(l); } catch { continue; }
              const ev = e.event || {}; const kind = ev.request ? (ev.request.method+" "+ev.request.url) : (ev.cron || (ev.workflowName ? "workflow "+ev.workflowName : JSON.stringify(ev).slice(0,120)));
              const bad = e.outcome !== "ok" || (e.exceptions||[]).length || (e.logs||[]).some(x=>x.level==="error");
              console.log(`[${e.outcome}] ${e.scriptName||""} ${kind} cpu=${e.cpuTime??""} wall=${e.wallTime??""}`);
              for (const x of e.exceptions||[]) console.log("   EXC", x.name, x.message);
              for (const x of (e.logs||[])) if (bad || x.level!=="log") console.log("   ", x.level, JSON.stringify(x.message).slice(0,400));
            }'
