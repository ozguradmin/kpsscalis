name: İş ajanını yayınla

on:
  push:
    branches: [is-ajani]
  workflow_dispatch:

concurrency:
  group: is-ajani
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Paket denetimi
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Cloudflare'e yayınla
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Ekran kayıtları 3 gün sonra silinsin (R2 yaşam döngüsü)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler r2 bucket lifecycle add ozgur-is-ajani rec-3-gun rec/ --expire-days 3 --force || echo "::warning::R2 yaşam döngüsü kuralı eklenemedi (Worker içindeki temizlik yine siler)"
      - name: Duman testi
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Adres: $URL"
          sleep 5
          curl -fsS "$URL/api/health"
